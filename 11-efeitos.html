<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik&display=swap"
      rel="stylesheet"
    />

    <title>Efeitos - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Rubik", sans-serif;

        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --background: #2d2a37;

        --bg-gradient:
          180deg, rgba(128, 126, 206, 1) 0%, rgba(142, 126, 206, 1) 100%;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
      }
    </style>
  </head>

  <body class="min-h-screen text-(--text) bg-linear-(--bg-gradient)">
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function Header() {
        return (
          <header className="flex items-center justify-between bg-(--background) py-4 px-8 rounded-b-2xl mb-20">
            <a
              href="/"
              className="flex items-center justify-center rounded-full text-xl size-8 cursor-pointer bg-(--primary) text-(--text) bg-linear-(--gradient) hover:bg-linear-(--gradient-hover) shadow-(--shadow)"
              title="Voltar"
            >
              {"<"}
            </a>

            <h1 className="text-2xl">Efeitos</h1>

            <div />
          </header>
        );
      }

      function Counter() {
        const [counter, setCounter] = React.useState(0);
        const [name, setName] = React.useState("");

        React.useEffect(() => {
          console.log("Componente montado!");

          return () => {
            console.log("Componente desmontado!");
          };
        }, []);

        React.useEffect(() => {
          if (counter > 0) {
            console.log(`Contador atualizado: ${counter}`);
          }
        }, [counter]);

        React.useEffect(() => {
          console.log(`Contador ou nome atualizados`);
        }, [counter, name]);

        return (
          <>
            <div>
              <label>Nome:</label>
              <input onChange={(event) => setName(event.target.value)} />
            </div>

            <p>
              Contador: <b>{counter}</b>
            </p>
            <button
              type="button"
              onClick={() => setCounter(10)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Atualizar
            </button>
            <button
              type="button"
              onClick={() => setCounter((prevValue) => prevValue + 1)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Incrementar
            </button>
            <button
              type="button"
              onClick={() => setCounter((prevValue) => prevValue - 1)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Decrementar
            </button>
          </>
        );
      }

      function App() {
        const [show, setShow] = React.useState(true);

        return (
          <>
            <Header />
            <main className="flex flex-col items-center">
              <button
                onClick={() => setShow(!show)}
                className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
              >
                Mostrar/Ocultar Contador
              </button>
              <hr />
              {show && <Counter />}
            </main>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
