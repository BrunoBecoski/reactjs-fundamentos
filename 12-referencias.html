<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>"
    />

    <title>Referências - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Rubik", sans-serif;

        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --background: #2d2a37;

        --bg-gradient:
          180deg, rgba(128, 126, 206, 1) 0%, rgba(142, 126, 206, 1) 100%;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
      }
    </style>
  </head>

  <body class="min-h-screen text-(--text) bg-linear-(--bg-gradient)">
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function Header() {
        return (
          <header className="flex items-center justify-between bg-(--background) py-4 px-8 rounded-b-2xl mb-20">
            <a
              href="/"
              title="Voltar"
              className="flex items-center justify-center rounded-full text-xl size-8 cursor-pointer bg-(--primary) text-(--text) bg-linear-(--gradient) hover:bg-linear-(--gradient-hover) shadow-(--shadow)"
            >
              {"<"}
            </a>

            <h1 className="text-2xl">Referências</h1>

            <div />
          </header>
        );
      }

      function InputFocus() {
        const ref = React.useRef(null);

        function handleClick() {
          ref?.current?.focus();
        }

        return (
          <div className="flex gap-4">
            <input
              ref={ref}
              placeholder="Clique no botão para focar"
              className="rounded-xl p-3 outline-none text-(--text) bg-linear-(--gradient) focus:bg-linear-(--gradient-hover) shadow-(--shadow) bg-(--background)"
            />
            <button
              onClick={handleClick}
              className="flex items-center justify-center rounded-xl p-3 cursor-pointer text-(--text) bg-linear-(--gradient) hover:bg-linear-(--gradient-hover) shadow-(--shadow) bg-(--primary)"
            >
              Focar no Input
            </button>
          </div>
        );
        sd;
      }

      function ScrollTracker() {
        const [scrollInfo, setScrollInfo] = React.useState({
          scrollTop: 0,
          scrollHeight: 0,
          clientHeight: 0,
        });
        const [scrollPercentage, setScrollPercentage] = React.useState(0);

        const containerRef = React.useRef(null);

        function handleContainerScroll() {
          if (!containerRef.current) {
            return;
          }

          const { scrollTop, scrollHeight, clientHeight } =
            containerRef.current;

          setScrollInfo({
            scrollTop,
            scrollHeight,
            clientHeight,
          });

          const maxScroll = scrollHeight - clientHeight;
          const percentage = Math.round((scrollTop / maxScroll) * 100);

          setScrollPercentage(percentage);
        }

        return (
          <div className="space-y-4">
            <div
              ref={containerRef}
              onScroll={handleContainerScroll}
              className="p-4 h-60 overflow-y-auto mt-4"
            >
              <div className="space-y-4">
                {Array.from({ length: 20 }).map((_, index) => (
                  <p
                    key={index}
                    className="text-center p-2 bg-(--primary) rounded"
                  >
                    <i>
                      Item do conteúdo:{" "}
                      <b>{(index + 1).toString().padStart(2, "0")}</b>
                    </i>
                  </p>
                ))}
              </div>
            </div>

            <ul className="space-y-2">
              <li>
                <i className="text-xl">
                  Progresso do scroll: <b>{scrollPercentage}%</b>
                </i>
              </li>
              <li>
                <i className="text-xl">
                  Onde está o scroll (scrollTop): <b>{scrollInfo.scrollTop}</b>
                </i>
              </li>
              <li>
                <i className="text-xl">
                  Tamanho do scroll (scrollHeight):{" "}
                  <b>{scrollInfo.scrollHeight}</b>
                </i>
              </li>
              <li>
                <i className="text-xl">
                  Tamanho do container (clientHeight):{" "}
                  <b>{scrollInfo.clientHeight}</b>
                </i>
              </li>
            </ul>
          </div>
        );
      }

      function App() {
        return (
          <>
            <Header />
            <main className="flex flex-col items-center bg-(--background) shadow-(--shadow) rounded-2xl p-14 w-fit mx-auto mb-20">
              <InputFocus />
              <hr />
              <ScrollTracker />
            </main>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
