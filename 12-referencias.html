<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Referências - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Rubik", sans-serif;

        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --background: #2d2a37;

        --bg-gradient:
          180deg, rgba(128, 126, 206, 1) 0%, rgba(142, 126, 206, 1) 100%;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
      }
    </style>
  </head>

  <body class="min-h-screen text-(--text) bg-linear-(--bg-gradient)">
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function InputFocus() {
        const ref = React.useRef(null);

        function handleClick() {
          ref?.current?.focus();
        }

        return (
          <div className="space-x-2">
            <input
              ref={ref}
              placeholder="Clique no botão para focar"
              className="p-2 border"
            />
            <button onClick={handleClick} className="p-2 border cursor-pointer">
              Focar no Input
            </button>
          </div>
        );
        sd;
      }

      function ScrollTracker() {
        const [scrollInfo, setScrollInfo] = React.useState({
          scrollTop: 0,
          scrollHeight: 0,
          clientHeight: 0,
        });
        const [scrollPercentage, setScrollPercentage] = React.useState(0);

        const containerRef = React.useRef(null);

        function handleContainerScroll() {
          if (!containerRef.current) {
            return;
          }

          const { scrollTop, scrollHeight, clientHeight } =
            containerRef.current;

          setScrollInfo({
            scrollTop,
            scrollHeight,
            clientHeight,
          });

          const maxScroll = scrollHeight - clientHeight;
          const percentage = Math.round((scrollTop / maxScroll) * 100);

          setScrollPercentage(percentage);
        }

        return (
          <div className="space-y-4">
            <div
              ref={containerRef}
              onScroll={handleContainerScroll}
              className="border border-blue-950 p-4 h-60 overflow-y-auto "
            >
              <div className="space-y-4">
                {Array.from({ length: 20 }).map((_, index) => (
                  <p key={index} className="p-2 text-black bg-gray-100 rounded">
                    Item do conteúdo: {index + 1}
                  </p>
                ))}
              </div>
            </div>

            <ul className="space-y-2 list-dic pl-5">
              <li>Progresso do scroll: {scrollPercentage}% </li>
              <li>Onde está o scroll (scrollTop): {scrollInfo.scrollTop}</li>
              <li>
                Tamanho do scroll (scrollHeight): {scrollInfo.scrollHeight}
              </li>
              <li>
                Tamanho do container (clientHeight): {scrollInfo.clientHeight}
              </li>
            </ul>
          </div>
        );
      }

      function App() {
        return (
          <main className="p-3 space-y-6">
            <InputFocus />
            <hr />
            <ScrollTracker />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
