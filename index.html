<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rocketseat - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --font: "Rubik", sans-serif;

        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --background: #2d2a37;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
      }
    </style>
  </head>
  <body
    class="min-h-screen text-(--text) font-(--font) bg-linear-[180deg,_#807ece_0%,_#8e7ece_100%]"
  >
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function Link({ href, children }) {
        return (
          <a
            href={href}
            className="bg-(--primary)  flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow)"
          >
            {children}
          </a>
        );
      }

      function App() {
        return (
          <main class="flex flex-wrap items-center justify-evenly h-screen max-w-md mx-auto">
            <Link href="01-hello-world.html">Hello Word</Link>
            <Link href="02-componentes.html">Componentes</Link>
            <Link href="03-propriedades.html">Propriedades</Link>
            <Link href="04-calculadora.html">Calculadora</Link>
            <Link href="05-eventos.html">Eventos</Link>
            <Link href="06-estados.html">Estados</Link>
            <Link href="07-condicionais.html">Condicionais</Link>
            <Link href="08-listas.html">Listas</Link>
            <Link href="09-listas-buscas.html">Listas Buscas</Link>
            <Link href="10-api-contexto.html">Api Contexto</Link>
            <Link href="11-efeitos.html">Efeitos</Link>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
