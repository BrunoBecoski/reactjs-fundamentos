<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rocketseat - React.js - Fundamentos</title>

    <style type="text/tailwindcss">
      @theme {
        --font: "Rubik", sans-serif;

        --text: #ebebeb;
        --text-secondary: #6b6b6b;
        --primary: #462878;
        --background: #2d2a37;

        --gradient:
          180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%;

        --gradient-hover:
          180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%;

        --shadow:
          0px 11px 7px 0px rgba(0, 0, 0, 0.01),
          0px 7px 7px 0px rgba(0, 0, 0, 0.04),
          0px 4px 6px 0px rgba(0, 0, 0, 0.1),
          0px 2px 4px 0px rgba(0, 0, 0, 0.26),
          0px 0px 2px 0px rgba(0, 0, 0, 0.29),
          0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const CounterContext = React.createContext();

      function CounterProvider({ children }) {
        const [savedCounts, setSavedCounts] = React.useState([]);

        function saveCount(count) {
          setSavedCounts((prevValue) => [...prevValue, count]);
        }

        return (
          <CounterContext.Provider value={{ savedCounts, saveCount }}>
            {children}
          </CounterContext.Provider>
        );
      }

      function Counter() {
        const [counter, setCounter] = React.useState(0);
        const { savedCounts, saveCount } = React.useContext(CounterContext);

        return (
          <>
            <p>
              Contador: <b>{counter}</b> - Último valor salvo{" "}
              <b>{savedCounts[savedCounts.length - 1] || ""}</b>
            </p>
            <button
              type="button"
              onClick={() => setCounter(10)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Atualizar
            </button>
            <button
              type="button"
              onClick={() => setCounter((prevValue) => prevValue + 1)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Incrementar
            </button>
            <button
              type="button"
              onClick={() => setCounter((prevValue) => prevValue - 1)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Decrementar
            </button>

            <button
              type="button"
              onClick={() => saveCount(counter)}
              className="flex items-center justify-center rounded-xl
              p-3 cursor-pointer text-(--text)
              bg-linear-(--gradient)
              hover:bg-linear-(--gradient-hover)
              shadow-(--shadow) bg-(--primary)"
            >
              Salvar
            </button>
          </>
        );
      }

      function CounterList() {
        const { savedCounts } = React.useContext(CounterContext);

        return (
          <div>
            <h2>Valores salvos</h2>
            <ul>
              {savedCounts.map((count, index) => (
                <li key={`count-${index}`}>{count}</li>
              ))}
            </ul>
          </div>
        );
      }

      function App() {
        return (
          <main>
            <CounterProvider>
              <Counter />

              <hr />

              <CounterList />
            </CounterProvider>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
